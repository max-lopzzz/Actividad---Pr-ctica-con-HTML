<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil</title>

    <!-- Bootstrap CSS (CDN) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <!-- Estilos propios -->
    <link href="style.css" rel="stylesheet" />
</head>
<body>
    <!-- Navbar Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Mi Sitio Web</a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tags.html">Etiquetas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="profile.html">Perfil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="form.html">Formulario</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-center mt-4">Perfil de Usuario</h1>
        <div class="text-center mb-3">
            <button id="btn-tema" type="button" class="btn btn-outline-secondary">Cambiar a tema oscuro</button>
        </div>

        <div id="perfil-mensaje" class="alert mt-3 profile-alerta" role="alert" hidden></div>

        <div id="perfil-datos" hidden>
            <div class="card profile-card">
                <div class="card-body text-center">
                    <img
                        src="https://placehold.co/200x200"
                        alt="Foto de perfil"
                        class="img-fluid rounded-circle"
                        width="200"
                        height="200"
                    />
                    <h2 class="mt-3" id="perfil-nombre"></h2>
                    <p class="text-start">
                        <strong>Correo:</strong> <span id="perfil-email"></span>
                        <br />
                        <strong>Miembro desde:</strong> <span id="perfil-fecha"></span>
                    </p>
                    <p class="texto-destacado">
                        Datos cargados desde la REST-API<sup>1</sup>.
                        <br />
                        <sub>1. Construcción de software y toma de decisiones.</sub>
                    </p>
                    <button id="btn-logout" type="button" class="btn btn-outline-primary">Cerrar sesión</button>
                </div>
            </div>

            <div class="card profile-card">
                <div class="card-body">
                    <h2 class="h4 mb-3">Editar mis datos</h2>
                    <form id="perfil-form">
                        <div class="mb-3">
                            <label for="edit-nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="edit-nombre" required />
                        </div>
                        <div class="mb-3">
                            <label for="edit-email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="edit-email" required />
                        </div>
                        <div class="mb-3">
                            <label for="edit-password" class="form-label">Nueva contraseña</label>
                            <input
                                type="password"
                                class="form-control"
                                id="edit-password"
                                placeholder="Déjala vacía para no cambiarla"
                                autocomplete="new-password"
                            />
                        </div>
                        <div class="d-flex gap-2 justify-content-between">
                            <button type="submit" class="btn btn-success">Guardar cambios</button>
                            <button id="btn-eliminar" type="button" class="btn btn-outline-danger">Eliminar cuenta</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>Página de perfil - práctica de HTML.</p>
    </footer>

    <!-- Bootstrap JS Bundle (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
