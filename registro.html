<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>

    <!-- Bootstrap CSS (CDN) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <!-- Estilos propios -->
    <link href="style.css" rel="stylesheet" />
</head>
<body>
    <!-- Navbar Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Mi Sitio Web</a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tags.html">Etiquetas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">Perfil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="form.html">Formulario</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="juego.html">Juego</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card login-card">
            <div class="card-header">
                <h2 class="mb-0">Crear cuenta</h2>
            </div>
            <div class="card-body">
                <form id="registro-form" novalidate>
                    <div class="mb-3">
                        <label for="reg-nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="reg-nombre" placeholder="Tu nombre" autocomplete="name" />
                    </div>
                    <div class="mb-3">
                        <label for="reg-email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="reg-email" placeholder="tucorreo@ejemplo.com" autocomplete="email" />
                    </div>
                    <div class="mb-3">
                        <label for="reg-password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="reg-password" autocomplete="new-password" />
                    </div>
                    <div class="mb-3">
                        <label for="reg-confirmar" class="form-label">Confirmar contraseña</label>
                        <input type="password" class="form-control" id="reg-confirmar" autocomplete="new-password" />
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">Registrarme</button>
                    </div>
                    <div id="registro-mensaje" class="alert mt-3" role="alert" hidden></div>
                </form>

                <p class="texto-destacado mt-3 text-center">
                    ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>

    <footer>
        <p>Página de registro - integración con la REST-API.</p>
    </footer>

    <!-- Bootstrap JS Bundle (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
