<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clippy vs BonziBuddy</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; background: #008080; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #008080; outline: none; }
      #cargando {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #fff; font: 600 18px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; gap: 12px;
      }
      #barra { width: 240px; height: 14px; border: 2px solid #fff; }
      #progreso { width: 0; height: 100%; background: #fff; }
    </style>
  </head>
  <body>
    <!-- El ID del usuario llega en la URL: index.html?user_id=ID (Unity lo lee con Application.absoluteURL) -->
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="cargando">
      <div>Cargando Clippy vs BonziBuddy...</div>
      <div id="barra"><div id="progreso"></div></div>
    </div>
    <script src="Build/game.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        dataUrl: "Build/game.data.unityweb",
        frameworkUrl: "Build/game.framework.js.unityweb",
        codeUrl: "Build/game.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Clippy vs BonziBuddy",
        productVersion: "1.0",
      }, function (avance) {
        document.querySelector("#progreso").style.width = (avance * 100) + "%";
      }).then(function () {
        document.querySelector("#cargando").remove();
        canvas.focus();
      }).catch(function (mensaje) {
        document.querySelector("#cargando").textContent = "No se pudo cargar el juego: " + mensaje;
      });
      // Al hacer clic en el juego, el canvas recibe el teclado
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    </script>
  </body>
</html>
